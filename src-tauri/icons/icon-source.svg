<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1B4CC4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F2E7A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas: macOS-style squircle with vertical brand-blue gradient -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#gloss)"/>

  <!-- Glyph: envelope (budgeting) receiving a coin (a dollar given a job) -->
  <g filter="url(#softShadow)">
    <!-- envelope body -->
    <rect x="232" y="404" width="560" height="332" rx="26" ry="26" fill="#FFFFFF"/>

    <!-- flap crease lines -->
    <path d="M 232 404 L 512 574 L 792 404" fill="none" stroke="#1B4CC4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- coin dropping into the envelope's flap notch -->
    <circle cx="512" cy="572" r="98" fill="url(#coin)" stroke="#15803D" stroke-width="6"/>
    <path d="M 470 576 L 500 606 L 566 540" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
