<!DOCTYPE html>
<html><head><meta charset='utf-8'><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .scr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body style='margin:0;background:#e9ebee;padding:24px'>
<div style="position:absolute; left:0; top:870px; width:640px" class="scr">
  <div data-drags-parent="1" style="font:600 13px/1.4 inherit; color:#6b7280; margin:0 0 10px 4px">Buttons — variants × states</div>
  <div style="background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(16,24,40,.08); padding:24px; border:1px solid #eef0f3; display:flex; flex-direction:column; gap:20px">
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">Primary</div>
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
        <button style="font:600 13px/1 inherit; color:#fff; background:#2563eb; border:none; padding:10px 16px; border-radius:8px; cursor:pointer">Add transaction</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#1d4ed8; border:none; padding:10px 16px; border-radius:8px; cursor:pointer">Hover</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#2563eb; border:none; padding:10px 16px; border-radius:8px; box-shadow:0 0 0 3px rgba(37,99,235,.4); cursor:pointer">Focus</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#1e40af; border:none; padding:10px 16px; border-radius:8px; cursor:pointer">Active</button>
        <button disabled="" style="font:600 13px/1 inherit; color:#fff; background:#9db8ee; border:none; padding:10px 16px; border-radius:8px; cursor:not-allowed">Disabled</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#2563eb; border:none; padding:10px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:8px"><span style="width:13px; height:13px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin .7s linear infinite"></span>Saving…</button>
      </div>
    </div>
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">Secondary</div>
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
        <button style="font:600 13px/1 inherit; color:#1f2937; background:#fff; border:1px solid #d1d5db; padding:10px 16px; border-radius:8px; cursor:pointer">Default</button>
        <button style="font:600 13px/1 inherit; color:#1f2937; background:#f9fafb; border:1px solid #d1d5db; padding:10px 16px; border-radius:8px; cursor:pointer">Hover</button>
        <button style="font:600 13px/1 inherit; color:#1f2937; background:#fff; border:1px solid #2563eb; padding:10px 16px; border-radius:8px; box-shadow:0 0 0 3px rgba(37,99,235,.4); cursor:pointer">Focus</button>
        <button disabled="" style="font:600 13px/1 inherit; color:#9ca3af; background:#f9fafb; border:1px solid #e5e7eb; padding:10px 16px; border-radius:8px; cursor:not-allowed">Disabled</button>
      </div>
    </div>
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">Ghost &amp; Destructive</div>
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
        <button style="font:600 13px/1 inherit; color:#2563eb; background:transparent; border:none; padding:10px 14px; border-radius:8px; cursor:pointer">Ghost</button>
        <button style="font:600 13px/1 inherit; color:#2563eb; background:#eff6ff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer">Ghost hover</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#dc2626; border:none; padding:10px 16px; border-radius:8px; cursor:pointer">Delete</button>
        <button style="font:600 13px/1 inherit; color:#fff; background:#b91c1c; border:none; padding:10px 16px; border-radius:8px; cursor:pointer">Delete hover</button>
      </div>
    </div>
  </div>
</div>
</body></html>
