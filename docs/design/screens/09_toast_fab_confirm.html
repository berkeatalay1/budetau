<!DOCTYPE html>
<html><head><meta charset='utf-8'><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .scr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body style='margin:0;background:#e9ebee;padding:24px'>
<div style="position:absolute; left:2660px; top:870px; width:520px" class="scr">
  <div data-drags-parent="1" style="font:600 13px/1.4 inherit; color:#6b7280; margin:0 0 10px 4px">Toast · FAB · confirm dialog</div>
  <div style="background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(16,24,40,.08); padding:24px; border:1px solid #eef0f3; display:flex; flex-direction:column; gap:22px">
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">Success toast</div>
      <div style="display:inline-flex; align-items:center; gap:11px; background:#1f2937; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 8px 24px rgba(16,24,40,.18)">
        <div style="width:20px; height:20px; border-radius:50%; background:#059669; color:#fff; font:700 12px/20px inherit; text-align:center; flex:none">✓</div>
        <span style="font:500 13px/1 inherit">Added <span class="num" style="font-weight:600">$5.75</span> to Dining Out</span>
        <span style="font:600 12px/1 inherit; color:#93c5fd; margin-left:4px">Undo</span>
      </div>
    </div>
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">FAB — Quick-Add (Cmd / Ctrl + K)</div>
      <div style="display:flex; align-items:center; gap:14px">
        <div style="width:52px; height:52px; border-radius:50%; background:#2563eb; box-shadow:0 6px 18px rgba(37,99,235,.4); position:relative; flex:none"><div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:20px; height:2.5px; background:#fff; border-radius:2px"></div><div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:2.5px; height:20px; background:#fff; border-radius:2px"></div></div>
        <span style="font:500 12px/1.4 inherit; color:#9ca3af">Fixed bottom-right · 24px inset</span>
      </div>
    </div>
    <div>
      <div style="font:600 12px/1 inherit; color:#9ca3af; margin-bottom:12px">Confirm dialog — destructive</div>
      <div style="border:1px solid #eef0f3; border-radius:12px; padding:18px; box-shadow:0 8px 24px rgba(16,24,40,.1)">
        <div style="font:600 15px/1.3 inherit; color:#1f2937; margin-bottom:6px">Delete this transaction?</div>
        <div style="font:400 13px/1.5 inherit; color:#6b7280; margin-bottom:16px">“Blue Bottle Coffee — $5.75” will be permanently removed. This can’t be undone.</div>
        <div style="display:flex; justify-content:flex-end; gap:10px">
          <button style="font:600 13px/1 inherit; color:#1f2937; background:#fff; border:1px solid #d1d5db; padding:9px 14px; border-radius:8px; cursor:pointer">Cancel</button>
          <button style="font:600 13px/1 inherit; color:#fff; background:#dc2626; border:none; padding:9px 14px; border-radius:8px; cursor:pointer">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
