<!DOCTYPE html>
<html><head><meta charset='utf-8'><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .scr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body style='margin:0;background:#e9ebee;padding:24px'>
<div style="position:absolute; left:720px; top:870px; width:560px" class="scr">
  <div data-drags-parent="1" style="font:600 13px/1.4 inherit; color:#6b7280; margin:0 0 10px 4px">Inputs &amp; form fields — states</div>
  <div style="background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(16,24,40,.08); padding:24px; border:1px solid #eef0f3; display:flex; flex-direction:column; gap:18px">
    <div>
      <div style="font:600 12px/1.4 inherit; color:#4b5563; margin-bottom:7px">Default</div>
      <div style="display:flex; align-items:center; height:42px; border:1px solid #d1d5db; border-radius:8px; padding:0 12px; font:400 14px/1 inherit; color:#9ca3af; background:#fff">Add a note…</div>
    </div>
    <div>
      <div style="font:600 12px/1.4 inherit; color:#4b5563; margin-bottom:7px">Focused</div>
      <div style="display:flex; align-items:center; height:42px; border:1px solid #2563eb; border-radius:8px; padding:0 12px; font:400 14px/1 inherit; color:#1f2937; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.35)">Whole Foods<span style="width:1px; height:18px; background:#2563eb; margin-left:1px"></span></div>
    </div>
    <div>
      <div style="font:600 12px/1.4 inherit; color:#4b5563; margin-bottom:7px">Amount input — currency formatted</div>
      <div style="display:flex; align-items:center; height:48px; border:1px solid #d1d5db; border-radius:8px; padding:0 14px; background:#fff"><span class="num" style="font:600 22px/1 inherit; color:#9ca3af">$</span><span class="num" style="font:600 22px/1 inherit; color:#1f2937; margin-left:2px">63.20</span></div>
    </div>
    <div>
      <div style="font:600 12px/1.4 inherit; color:#dc2626; margin-bottom:7px">Error</div>
      <div style="display:flex; align-items:center; height:42px; border:1px solid #dc2626; border-radius:8px; padding:0 12px; font:400 14px/1 inherit; color:#1f2937; background:#fff; box-shadow:0 0 0 3px rgba(220,38,38,.18)"></div>
      <div style="font:500 12px/1.4 inherit; color:#dc2626; margin-top:6px">Amount is required.</div>
    </div>
    <div>
      <div style="font:600 12px/1.4 inherit; color:#9ca3af; margin-bottom:7px">Disabled</div>
      <div style="display:flex; align-items:center; height:42px; border:1px solid #e5e7eb; border-radius:8px; padding:0 12px; font:400 14px/1 inherit; color:#c2c7cf; background:#f9fafb">Locked</div>
    </div>
  </div>
</div>
</body></html>
