<!DOCTYPE html>
<html><head><meta charset='utf-8'><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .scr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body style='margin:0;background:#e9ebee;padding:24px'>
<div style="position:absolute; left:1960px; top:150px; width:440px" class="scr">
  <div data-drags-parent="1" style="font:600 13px/1.4 inherit; color:#6b7280; margin:0 0 10px 4px">Spacing · radius · wordmark</div>

      <div style="text-align:center"><div style="width:8px; height:8px; background:#2563eb; border-radius:2px; margin:0 auto"></div><div class="num" style="font:500 10px/1 inherit; color:#9ca3af; margin-top:6px">8</div></div>

      <div style="text-align:center"><div style="width:16px; height:16px; background:#2563eb; border-radius:3px; margin:0 auto"></div><div class="num" style="font:500 10px/1 inherit; color:#9ca3af; margin-top:6px">16</div></div>

    </div>
    <div style="font:600 12px/1 inherit; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px">Radius</div>
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px">

    </div>
    <div style="font:600 12px/1 inherit; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px">Wordmark</div>
    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap">
      <div style="display:flex; align-items:center; gap:11px">
        <div style="width:30px; height:30px; border-radius:8px; background:#2563eb; position:relative; flex:none"><div style="position:absolute; left:8px; top:8px; width:14px; height:14px; border-radius:50%; border:2.5px solid #fff"></div></div>
        <div style="font:700 19px/1 inherit; color:#1f2937; letter-spacing:-0.01em">Budetau</div>
      </div>
      <div style="display:flex; align-items:center; gap:11px; background:#171a21; padding:10px 14px; border-radius:10px">
        <div style="width:30px; height:30px; border-radius:8px; background:#3b82f6; position:relative; flex:none"><div style="position:absolute; left:8px; top:8px; width:14px; height:14px; border-radius:50%; border:2.5px solid #fff"></div></div>
        <div style="font:700 19px/1 inherit; color:#e8eaed; letter-spacing:-0.01em">Budetau</div>
      </div>
    </div>
  </div>

</body></html>
