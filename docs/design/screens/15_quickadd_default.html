<!DOCTYPE html>
<html><head><meta charset='utf-8'><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .scr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body style='margin:0;background:#e9ebee;padding:24px'>
<div style="position:absolute; left:0; top:3810px; width:1200px" class="scr" data-screen-label="Quick-Add · Collapsed">
  <div data-drags-parent="1" style="font:600 13px/1.4 inherit; color:#6b7280; margin:0 0 10px 4px">Quick-Add — default (streamlined) · ⌘K · autocomplete open</div>
  <div style="position:relative; height:660px; background:#e9ebee; border-radius:12px; box-shadow:0 16px 48px rgba(16,24,40,.16); border:1px solid #e8eaee; overflow:hidden">
    <!-- ghost app behind -->
    <div style="position:absolute; inset:0; padding:28px 32px; opacity:.5">
      <div style="height:26px; width:200px; background:#fff; border-radius:6px; margin-bottom:18px"></div>
      <div style="height:120px; background:#fff; border-radius:12px; margin-bottom:16px"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px"><div style="height:120px; background:#fff; border-radius:12px"></div><div style="height:120px; background:#fff; border-radius:12px"></div><div style="height:120px; background:#fff; border-radius:12px"></div></div>
    </div>
    <!-- scrim + modal -->
    <div style="position:absolute; inset:0; background:rgba(15,17,22,.42); display:flex; align-items:flex-start; justify-content:center; padding-top:54px">
      <div style="width:440px; background:#fff; border-radius:14px; box-shadow:0 24px 64px rgba(0,0,0,.32); overflow:hidden">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px"><div style="font:600 15px/1 inherit; color:#1f2937">New transaction</div><span style="font:600 11px/1 inherit; color:#9ca3af; background:#f1f3f5; border:1px solid #e6e8ec; border-radius:6px; padding:4px 7px">Esc</span></div>
        <div style="padding:4px 20px 8px; display:flex; flex-direction:column; gap:16px">
          <!-- amount -->
          <div style="display:flex; gap:11px; align-items:flex-start">
            <div style="width:18px; height:18px; border-radius:50%; background:#2563eb; color:#fff; font:600 10px/18px inherit; text-align:center; flex:none; margin-top:24px">1</div>
            <div style="flex:1"><div style="font:600 12px/1 inherit; color:#4b5563; margin-bottom:7px">Amount</div><div style="display:flex; align-items:center; height:50px; border:1px solid #2563eb; border-radius:8px; padding:0 14px; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.3)"><span class="num" style="font:600 24px/1 inherit; color:#9ca3af">$</span><span class="num" style="font:600 24px/1 inherit; color:#1f2937; margin-left:3px">12.50</span><span style="width:2px; height:24px; background:#2563eb; margin-left:2px"></span></div></div>
          </div>
          <!-- category w/ autocomplete -->
          <div style="display:flex; gap:11px; align-items:flex-start">
            <div style="width:18px; height:18px; border-radius:50%; background:#2563eb; color:#fff; font:600 10px/18px inherit; text-align:center; flex:none; margin-top:24px">2</div>
            <div style="flex:1; position:relative"><div style="font:600 12px/1 inherit; color:#4b5563; margin-bottom:7px">Category</div><div style="display:flex; align-items:center; height:42px; border:1px solid #d1d5db; border-radius:8px; padding:0 12px; background:#fff; font:400 14px/1 inherit; color:#1f2937">Din<span style="width:1px; height:18px; background:#1f2937; margin-left:1px"></span></div>
              <div style="position:absolute; left:0; right:0; top:74px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 12px 28px rgba(16,24,40,.16); padding:5px; z-index:2">
                <div style="display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; background:#eff6ff"><span style="width:10px; height:10px; border-radius:50%; background:#E57373"></span><span style="font:600 13px/1 inherit; color:#1f2937">Dining Out</span><span style="margin-left:auto; font:500 11px/1 inherit; color:#9ca3af">↵</span></div>
                <div style="display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px"><span style="width:10px; height:10px; border-radius:50%; background:#4DD0E1"></span><span style="font:500 13px/1 inherit; color:#1f2937">Dining — Coffee</span></div>
                <div style="display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px"><span style="width:10px; height:10px; border-radius:50%; background:#9ca3af"></span><span style="font:500 13px/1 inherit; color:#6b7280">+ Create “Din”</span></div>
              </div>
            </div>
          </div>
          <!-- date -->
          <div style="display:flex; gap:11px; align-items:flex-start">
            <div style="width:18px; height:18px; border-radius:50%; background:#2563eb; color:#fff; font:600 10px/18px inherit; text-align:center; flex:none; margin-top:24px">3</div>
            <div style="flex:1"><div style="font:600 12px/1 inherit; color:#4b5563; margin-bottom:7px">Date</div><div style="display:flex; align-items:center; justify-content:space-between; height:42px; border:1px solid #d1d5db; border-radius:8px; padding:0 12px; background:#fff"><span style="font:400 14px/1 inherit; color:#1f2937">Today · Jun 25, 2026</span><span style="font:500 12px/1 inherit; color:#9ca3af">📅</span></div></div>
          </div>
        </div>
        <!-- add details toggle -->
        <div style="padding:16px 20px 4px; margin-left:29px"><div style="display:flex; align-items:center; gap:10px"><div style="width:38px; height:22px; background:#d1d5db; border-radius:999px; position:relative; flex:none"><div style="position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.2)"></div></div><div><span style="font:500 13px/1 inherit; color:#1f2937">Add details</span> <span style="font:400 12px/1 inherit; color:#9ca3af">— note, account, type</span></div></div></div>
        <!-- footer -->
        <div style="display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:16px 20px; margin-top:14px; border-top:1px solid #f1f3f5">
          <button style="font:600 13px/1 inherit; color:#1f2937; background:#fff; border:1px solid #d1d5db; padding:10px 15px; border-radius:8px; cursor:pointer">Cancel</button>
          <button style="font:600 13px/1 inherit; color:#fff; background:#2563eb; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:8px">Add <span class="num">$12.50</span><span style="opacity:.7">↵</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
